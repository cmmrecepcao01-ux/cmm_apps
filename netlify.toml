[build]
  command = "bash scripts/build-webapps.sh"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # O binário do Chromium (@sparticuz/chromium) é grande — inclui
  # explicitamente os arquivos que ele precisa no pacote da função.
  included_files = ["node_modules/@sparticuz/chromium/**"]
  # "puppeteer" (completo, com Chromium para Windows) só é usado rodando
  # local (netlify dev) — não deixa o esbuild tentar empacotar ele junto
  # na publicação, onde é inútil e só pesaria o pacote da função à toa.
  external_node_modules = ["puppeteer"]

# Plugin local que guarda, entre deploys, o dist/ já compilado de cada
# pasta — usado pelo scripts/build-webapps.sh para pular a recompilação de
# pastas sem alterações (economiza minutos de build).
[[plugins]]
  package = "./netlify/plugins/skip-unchanged"
